<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DapurTakaran - Solusi Ukuran & Konversi Masak Digital</title>
    
    <!-- CSS Internal untuk Styling UI/UX yang Modern & Menarik -->
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #f8f9fa;
            --text-color: #333333;
            --accent-color: #4ecdc4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        .card-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #ff5252;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e8f8f5;
            border-left: 5px solid var(--accent-color);
            border-radius: 4px;
            display: none; /* Disembunyikan dulu sebelum ada hasil */
        }

        .result-box h3 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bagian Header Website -->
        <header>
            <h1>🍳 DapurTakaran Digital</h1>
            <p>Bantu ibu-ibu & Gen Z konversi takaran bahan masakan tanpa ribet!</p>
        </header>

        <!-- Bagian Fitur Utama / Kalkulator Konversi -->
        <div class="card-form">
            <label for="ingredient">Pilih Bahan Makanan:</label>
            <select id="ingredient">
                <option value="tepung">Tepung Terigu (gram ke sendok makan)</option>
                <option value="gula">Gula Pasir (gram ke sendok makan)</option>
                <option value="mentega">Mentega / Margarin (gram ke sendok makan)</option>
            </select>

            <label for="weightInput">Masukkan Berat (Gram):</label>
            <input type="number" id="weightInput" placeholder="Contoh: 100">

            <button id="calcBtn">Hitung Takaran</button>
        </div>

        <!-- Bagian Hasil Perhitungan (Dikelola dengan JavaScript) -->
        <div id="resultBox" class="result-box">
            <h3>Hasil Konversi:</h3>
            <p id="resultText">-</p>
        </div>

        <!-- Footer Startup -->
        <footer>
            <p>&copy; 2026 DapurTakaran. Dibuat oleh Calon Technopreneur SMK.</p>
        </footer>
    </div>

    <!-- JavaScript Internal untuk Logika Bisnis & Interaksi -->
    <script>
        // Mengambil elemen dari HTML
        const calcBtn = document.getElementById('calcBtn');
        const weightInput = document.getElementById('weightInput');
        const ingredientSelect = document.getElementById('ingredient');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');

        // Fungsi ketika tombol hitung diklik
        calcBtn.addEventListener('click', function() {
            let weight = parseFloat(weightInput.value);
            let ingredient = ingredientSelect.value;

            // Validasi input sederhana
            if (isNaN(weight) || weight <= 0) {
                alert("Mohon masukkan angka berat yang valid!");
                return;
            }

            let conversionRate = 15; // Standar umum: 1 sendok makan bahan sekitar 10-15 gram
            let ingredientName = "";

            if (ingredient === "tepung") {
                conversionRate = 10; // 1 sdm tepung terigu ± 10 gram
                ingredientName = "Tepung Terigu";
            } else if (ingredient === "gula") {
                conversionRate = 12; // 1 sdm gula pasir ± 12 gram
                ingredientName = "Gula Pasir";
            } else if (ingredient === "mentega") {
                conversionRate = 15; // 1 sdm mentega ± 15 gram
                ingredientName = "Mentega/Margarin";
            }

            // Hitung estimasi sendok makan
            let tablespoons = (weight / conversionRate).toFixed(1);

            // Tampilkan hasil ke halaman web
            resultText.innerHTML = `<b>${weight} gram</b> ${ingredientName} setara dengan sekitar <b>${tablespoons} Sendok Makan (SDM)</b> penuh.`;
            resultBox.style.display = "block";
        });
    </script>

</body>
</html>
